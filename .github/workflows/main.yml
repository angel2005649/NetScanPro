
name: Build NetScan Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip NetScanPro_mobile_build.zip -d extracted

      - name: Compilar APK
        run: gradle -p extracted assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NetScanPro-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          
